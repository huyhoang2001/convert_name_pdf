name: Windows Installer + Modular Update Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      B6H_UPDATE_TRUST_ROOTS: '{"b6h-update-ed25519-2026-11":"db1c5981992f0efc47edd9b9f4d5cc9d9e5a29e655d15d3b71b8d5d569c74b0c"}'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match package version $version" }

      - name: Install dependencies
        run: npm ci

      - name: Run Node regression tests
        run: npm test

      - name: Build production update runner
        run: npm run build:update-runner

      - name: Run desktop Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1

      - name: Run update runner recovery tests
        shell: pwsh
        env:
          B6H_TEST_SKIP_RUNONCE: '1'
          CARGO_TARGET_DIR: src-tauri/target
        run: |
          cargo test --manifest-path src-tauri/update-runner/Cargo.toml --locked --target x86_64-pc-windows-msvc --features update-test-keys --bin b6h-update-runner -- --test-threads=1

      - name: Build modular frontend payload
        run: npm run build:frontend-update

      - name: Build production Windows installer
        run: npm run build:installer

      - name: Verify production installer and prepare draft assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $nsis = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter '*.exe' -File
          if ($nsis.Count -ne 1) { throw "Expected one NSIS installer; found $($nsis.Count)." }
          $setup = "B6H-v$version-x64-Setup.exe"
          Copy-Item $nsis[0].FullName $setup
          $bytes = (Get-Item $setup).Length
          if ($bytes -ge 50000000) { throw "Setup.exe is $bytes bytes; limit is 50,000,000." }
          $app = "src-tauri/target/x86_64-pc-windows-msvc/release/b6h.exe"
          $runner = "src-tauri/target/x86_64-pc-windows-msvc/release/b6h-update-runner.exe"
          $forbidden = @('local-test-only', 'B6H_UPDATE_TEST_CA', 'B6H_UPDATE_TEST_ENDPOINT', 'https://localhost:8443', 'B6H_TEST_')
          $testKeyHex = 'AE0E54C009C07D5C26150D1F4C910A5CB50C9BCB714F40B308AEC040BA1ACCBF'
          $productionKeyHex = 'db1c5981992f0efc47edd9b9f4d5cc9d9e5a29e655d15d3b71b8d5d569c74b0c'
          foreach ($binary in @($app, $runner)) {
            $data = [IO.File]::ReadAllBytes($binary)
            $text = [Text.Encoding]::ASCII.GetString($data)
            foreach ($marker in $forbidden) { if ($text.Contains($marker)) { throw "Production binary contains test marker '$marker': $binary" } }
            $hex = [Convert]::ToHexString($data)
            if ($hex.Contains($testKeyHex)) { throw "Production binary contains the local test trust root: $binary" }
            if (-not $text.Contains('b6h-update-ed25519-2026-11') -or -not $text.Contains($productionKeyHex)) { throw "Production trust root is missing from $binary" }
          }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$setup.sha256" "$hash *$setup" -Encoding ascii
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'NotSigned') { throw "Expected unsigned Setup.exe; Authenticode status is $($signature.Status)." }
          @("Version: $version", "Setup bytes: $bytes", "Setup SHA-256: $hash", "Authenticode: $($signature.Status)", "Update key ID: b6h-update-ed25519-2026-11", "Test keys/endpoints/hooks: absent from app and runner") | Set-Content RELEASE-EVIDENCE.txt -Encoding utf8

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: B6H v3.0.0 — Installer & Modular Update
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
          files: |
            B6H-v3.0.0-x64-Setup.exe
            B6H-v3.0.0-x64-Setup.exe.sha256
            RELEASE-EVIDENCE.txt
