[package]
name = "b6h"
version = "2.0.25"
description = "B6H desktop application"
authors = ["Local"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "b6h_lib"
crate-type = ["rlib"]

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = false
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
debug = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["devtools"] }
tauri-plugin-dialog = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
umya-spreadsheet = "2"
keyring = { version = "3", features = ["windows-native"] }
num-bigint = "0.4"
num-traits = "0.2"
futures-util = "0.3"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["time", "macros", "sync"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
craft-print = { package = "craft-print", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", version = "=0.1.0" }

[target.'cfg(windows)'.dependencies]
winprint = { git = "https://github.com/storytold/winprint.rs", rev = "5f80b9baf6b58937c401656634e42d33f00ddf49", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
