name: B6H Incremental Production Release

on:
  workflow_dispatch:
    inputs:
      authorize_production_signing:
        description: Explicitly authorize production signing and publication for this version tag
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: b6h-production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.authorize_production_signing == true && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 90
    environment: b6h-production-release
    env:
      B6H_UPDATE_TRUST_ROOTS: '{"b6h-update-ed25519-2026-11":"db1c5981992f0efc47edd9b9f4d5cc9d9e5a29e655d15d3b71b8d5d569c74b0c"}'
      CARGO_TARGET_DIR: src-tauri/target
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Reuse npm and Cargo caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: windows-x64-msvc-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/update-runner/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-x64-msvc-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/update-runner/Cargo.lock') }}-

      - name: Validate signing credential before builds
        shell: pwsh
        env:
          B6H_UPDATE_SIGNING_KEY_B64: ${{ secrets.B6H_UPDATE_SIGNING_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:B6H_UPDATE_SIGNING_KEY_B64)) {
            throw 'Missing protected environment secret B6H_UPDATE_SIGNING_KEY_B64. See docs/DEVELOPER_RELEASES.md.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'b6h-update-signing.pem'
          $publicPath = Join-Path $env:RUNNER_TEMP 'b6h-update-public.pem'
          $bytes = [Convert]::FromBase64String($env:B6H_UPDATE_SIGNING_KEY_B64)
          [IO.File]::WriteAllBytes($keyPath, $bytes)
          node scripts/release-plan.mjs verify-key --key $keyPath --key-id b6h-update-ed25519-2026-11 --public-output $publicPath
          if ($LASTEXITCODE -ne 0) { throw 'Production signing credential verification failed.' }
          "keyPath=$keyPath" >> $env:GITHUB_OUTPUT
          "publicPath=$publicPath" >> $env:GITHUB_OUTPUT
        id: signing

      - name: Detect changed components and validate release versions
        id: plan
        shell: pwsh
        run: |
          $json = node scripts/release-plan.mjs plan --tag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Release planning failed.' }
          $plan = $json | ConvertFrom-Json
          if ($plan.releaseIdentity.revision -gt 0) { throw 'Revision packaging is blocked until shipped base-version discovery and activation have been verified.' }
          $components = @($plan.components)
          $runner = @($plan.paths | Where-Object { $_ -like 'src-tauri/update-runner/*' }).Count -gt 0
          "base=$($plan.base)" >> $env:GITHUB_OUTPUT
          "components=$($components -join ',')" >> $env:GITHUB_OUTPUT
          "frontend=$(([bool]($components -contains 'frontend')).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "core=$(([bool]($components -contains 'core')).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "wordcraft=$(([bool]($components -contains 'wordcraft')).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "runner=$(([bool]$runner).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_OUTPUT
          "revision=$($plan.releaseIdentity.revision)" >> $env:GITHUB_OUTPUT
          "baseVersion=$($plan.releaseIdentity.baseVersion)" >> $env:GITHUB_OUTPUT
          "frontendVersion=$($plan.frontendVersion)" >> $env:GITHUB_OUTPUT
          "coreVersion=$($plan.coreVersion)" >> $env:GITHUB_OUTPUT
          "wordcraftVersion=$($plan.wordcraftVersion)" >> $env:GITHUB_OUTPUT
          "previousCoreVersion=$($plan.previousCoreVersion)" >> $env:GITHUB_OUTPUT

      - name: Install locked frontend and release tooling dependencies
        run: npm ci

      - name: Run release tooling and affected Frontend regressions
        run: npm test

      - name: Validate Wordcraft runtime when changed
        if: steps.plan.outputs.wordcraft == 'true'
        run: npm run wordcraft:build

      - name: Run affected Core update discovery tests
        if: steps.plan.outputs.core == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --features update-test-keys modular_update::tests -- --test-threads=1

      - name: Run Update Runner recovery tests when its source changed
        if: steps.plan.outputs.runner == 'true'
        shell: pwsh
        env:
          B6H_TEST_SKIP_RUNONCE: '1'
        run: cargo test --manifest-path src-tauri/update-runner/Cargo.toml --locked --target x86_64-pc-windows-msvc --features update-test-keys --bin b6h-update-runner -- --test-threads=1

      - name: Build Core and lightweight installer when changed
        if: steps.plan.outputs.core == 'true'
        run: npm run build:installer

      - name: Build Frontend payload when changed
        if: steps.plan.outputs.frontend == 'true'
        run: npm run build:frontend-update

      - name: Prepare signed packages, catalog, and installer assets
        id: assets
        shell: pwsh
        env:
          B6H_SIGNING_KEY: ${{ steps.signing.outputs.keyPath }}
          B6H_PUBLIC_KEY: ${{ steps.signing.outputs.publicPath }}
          B6H_BASE_TAG: ${{ steps.plan.outputs.base }}
          B6H_VERSION: ${{ steps.plan.outputs.version }}
          B6H_FRONTEND_CHANGED: ${{ steps.plan.outputs.frontend }}
          B6H_CORE_CHANGED: ${{ steps.plan.outputs.core }}
          B6H_WORDCRAFT_CHANGED: ${{ steps.plan.outputs.wordcraft }}
          B6H_REVISION: ${{ steps.plan.outputs.revision }}
          B6H_BASE_VERSION: ${{ steps.plan.outputs.baseVersion }}
          B6H_FRONTEND_VERSION: ${{ steps.plan.outputs.frontendVersion }}
          B6H_CORE_VERSION: ${{ steps.plan.outputs.coreVersion }}
          B6H_WORDCRAFT_VERSION: ${{ steps.plan.outputs.wordcraftVersion }}
          B6H_PREVIOUS_CORE_VERSION: ${{ steps.plan.outputs.previousCoreVersion }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'b6h-release-assets'
          $previousDir = Join-Path $env:RUNNER_TEMP 'b6h-previous-release'
          $coreInput = Join-Path $env:RUNNER_TEMP 'b6h-core-input'
          $compatibleCore = if ($env:B6H_REVISION -ne '0') { $env:B6H_BASE_VERSION } else { '3.0.0' }
          New-Item -ItemType Directory -Path $releaseDir,$previousDir -Force | Out-Null
          $previousDraft = gh release view $env:B6H_BASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -ne 0 -or $previousDraft.Trim() -ne 'false') { throw "Base release $env:B6H_BASE_TAG is not a published stable release." }
          gh release download $env:B6H_BASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'catalog.json' --pattern 'catalog.sig' --pattern 'catalog.json.sha256' --pattern 'catalog.sig.sha256' --dir $previousDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the previous signed stable catalog.' }
          node scripts/update-package.mjs verify-catalog --catalog (Join-Path $previousDir 'catalog.json') --signature (Join-Path $previousDir 'catalog.sig') --key $env:B6H_PUBLIC_KEY --key-id b6h-update-ed25519-2026-11 --packages-dir $previousDir
          if ($LASTEXITCODE -ne 0) { throw 'The previous stable catalog or one of its packages failed verification.' }
          $previousFullCatalog = Join-Path $previousDir 'catalog.json'
          $previousFullSignature = Join-Path $previousDir 'catalog.sig'
          $previousAssetNames = @(gh release view $env:B6H_BASE_TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect previous release assets.' }
          if ($previousAssetNames -contains 'catalog-v2.json' -or $previousAssetNames -contains 'catalog-v2.sig') {
            if (-not ($previousAssetNames -contains 'catalog-v2.json' -and $previousAssetNames -contains 'catalog-v2.sig')) { throw 'Previous revision catalog is incomplete.' }
            gh release download $env:B6H_BASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'catalog-v2.json' --pattern 'catalog-v2.sig' --pattern 'catalog-v2.json.sha256' --pattern 'catalog-v2.sig.sha256' --dir $previousDir
            if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the previous revision catalog.' }
            $previousFullCatalog = Join-Path $previousDir 'catalog-v2.json'
            $previousFullSignature = Join-Path $previousDir 'catalog-v2.sig'
            node scripts/update-package.mjs verify-catalog --catalog $previousFullCatalog --signature $previousFullSignature --key $env:B6H_PUBLIC_KEY --key-id b6h-update-ed25519-2026-11 --packages-dir $previousDir
            if ($LASTEXITCODE -ne 0) { throw 'The previous revision catalog failed verification.' }
          }
          gh release download $env:B6H_BASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'B6H-*-x64-Setup.exe' --pattern 'B6H-*-x64-Setup.exe.sha256' --dir $previousDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the previous compatible installer for reuse or online discovery verification.' }
          $previousSetups = @(Get-ChildItem $previousDir -Filter 'B6H-*-x64-Setup.exe' -File)
          if ($previousSetups.Count -ne 1) { throw "Expected one previous installer; found $($previousSetups.Count)." }
          $previousSetup = $previousSetups[0].FullName
          $previousSidecar = "$previousSetup.sha256"
          $previousExpected = (Get-Content -LiteralPath $previousSidecar -Raw).Trim()
          $previousActual = (Get-FileHash -LiteralPath $previousSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($previousExpected -ne "$previousActual *$($previousSetups[0].Name)" -or $previousSetups[0].Length -ge 50000000 -or (Get-AuthenticodeSignature $previousSetup).Status -ne 'NotSigned') { throw 'The previous installer failed checksum or lightweight Setup validation.' }

          if ($env:B6H_FRONTEND_CHANGED -eq 'true') {
            $frontend = Join-Path $releaseDir "B6H-v$env:B6H_VERSION-frontend.b6hupdate"
            $frontendMinimumCore = if ($env:B6H_CORE_CHANGED -eq 'true') { $env:B6H_CORE_VERSION } else { $env:B6H_PREVIOUS_CORE_VERSION }
            node scripts/update-package.mjs pack --component frontend --input dist/frontend-update --output $frontend --key $env:B6H_SIGNING_KEY --key-id b6h-update-ed25519-2026-11 --channel stable --version $env:B6H_FRONTEND_VERSION --release-id "frontend-v$env:B6H_VERSION" --core $frontendMinimumCore --previous-catalog $previousFullCatalog
            if ($LASTEXITCODE -ne 0) { throw 'Frontend update package generation failed.' }
          }

          if ($env:B6H_CORE_CHANGED -eq 'true') {
            $bundle = Get-Item -LiteralPath "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/B6H_$($env:B6H_CORE_VERSION)_x64-setup.exe" -ErrorAction Stop
            $setupName = "B6H-v$env:B6H_VERSION-x64-Setup.exe"
            $setupPath = Join-Path $releaseDir $setupName
            Copy-Item -LiteralPath $bundle.FullName -Destination $setupPath
            $setupBytes = (Get-Item -LiteralPath $setupPath).Length
            if ($setupBytes -ge 50000000) { throw "Setup.exe is $setupBytes bytes; limit is 50,000,000." }
            $hash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "$setupPath.sha256" -Value "$hash *$setupName" -Encoding ascii
            $coreInputFile = Join-Path $coreInput $setupName
            New-Item -ItemType Directory -Path $coreInput -Force | Out-Null
            Copy-Item -LiteralPath $setupPath -Destination $coreInputFile
            $core = Join-Path $releaseDir "B6H-v$env:B6H_VERSION-core.b6hupdate"
            node scripts/update-package.mjs pack --component core --input $coreInput --output $core --key $env:B6H_SIGNING_KEY --key-id b6h-update-ed25519-2026-11 --channel stable --version $env:B6H_CORE_VERSION --release-id "core-v$env:B6H_VERSION" --core $compatibleCore --previous-catalog $previousFullCatalog
            if ($LASTEXITCODE -ne 0) { throw 'Core update package generation failed.' }
          } else {
            Copy-Item -LiteralPath $previousSetup -Destination (Join-Path $releaseDir $previousSetups[0].Name)
            Copy-Item -LiteralPath $previousSidecar -Destination (Join-Path $releaseDir ($previousSetups[0].Name + '.sha256'))
          }

          if ($env:B6H_WORDCRAFT_CHANGED -eq 'true') {
            npm run wordcraft:build
            if ($LASTEXITCODE -ne 0) { throw 'Wordcraft runtime validation failed.' }
            $wordcraft = Join-Path $releaseDir "B6H-v$env:B6H_VERSION-wordcraft.b6hupdate"
            node scripts/update-package.mjs pack --component wordcraft --input public/wordcraft --output $wordcraft --key $env:B6H_SIGNING_KEY --key-id b6h-update-ed25519-2026-11 --channel stable --version $env:B6H_WORDCRAFT_VERSION --release-id "wordcraft-v$env:B6H_VERSION" --core $compatibleCore --previous-catalog $previousFullCatalog
            if ($LASTEXITCODE -ne 0) { throw 'Wordcraft update package generation failed.' }
          }

          $packages = @(Get-ChildItem $releaseDir -Filter '*.b6hupdate' -File | ForEach-Object FullName)
          if ($packages.Count -eq 0) { throw 'The component plan produced no update packages.' }
          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:B6H_VERSION"
          $catalog = Join-Path $releaseDir 'catalog.json'
          $legacyPackages = @($packages | Where-Object {
            if ($_ -like '*-frontend.b6hupdate') { return [version]$frontendMinimumCore -le [version]$env:B6H_BASE_VERSION }
            return $true
          })
          $needsFullCatalog = $env:B6H_REVISION -ne '0' -or $legacyPackages.Count -ne $packages.Count
          if ($needsFullCatalog) {
            $previousLegacy = Get-Content -LiteralPath (Join-Path $previousDir 'catalog.json') -Raw | ConvertFrom-Json
            if ($legacyPackages.Count -eq 0 -and -not @($previousLegacy.packages | Where-Object component -eq 'core').Count) { throw 'No Core bridge or compatible package is available to the previous updater.' }
          }
          $legacyComponents = @($legacyPackages | ForEach-Object { if ($_ -match '-(frontend|core|wordcraft)\.b6hupdate$') { $Matches[1] } })
          "legacyComponents=$($legacyComponents -join ',')" >> $env:GITHUB_OUTPUT
          $legacyArgs = if ($legacyPackages.Count) { @('--packages', ($legacyPackages -join ',')) } else { @('--empty') }
          node scripts/update-package.mjs catalog @legacyArgs --previous-catalog (Join-Path $previousDir 'catalog.json') --previous-signature (Join-Path $previousDir 'catalog.sig') --output $catalog --key $env:B6H_SIGNING_KEY --key-id b6h-update-ed25519-2026-11 --channel stable --base-url $baseUrl
          if ($LASTEXITCODE -ne 0) { throw 'Production catalog signing failed.' }
          node scripts/update-package.mjs verify-catalog --catalog $catalog --signature (Join-Path $releaseDir 'catalog.sig') --key $env:B6H_PUBLIC_KEY --key-id b6h-update-ed25519-2026-11 --packages-dir $releaseDir
          if ($LASTEXITCODE -ne 0) { throw 'The new signed catalog or one of its packages failed verification.' }
          if ($needsFullCatalog) {
            $legacySequence = (Get-Content -LiteralPath $catalog -Raw | ConvertFrom-Json).sequence
            $previousFullSequence = (Get-Content -LiteralPath $previousFullCatalog -Raw | ConvertFrom-Json).sequence
            $fullSequence = [Math]::Max($legacySequence, $previousFullSequence) + 1
            $fullCatalog = Join-Path $releaseDir 'catalog-v2.json'
            node scripts/update-package.mjs catalog --packages ($packages -join ',') --previous-catalog $previousFullCatalog --previous-signature $previousFullSignature --sequence $fullSequence --output $fullCatalog --key $env:B6H_SIGNING_KEY --key-id b6h-update-ed25519-2026-11 --channel stable --base-url $baseUrl
            if ($LASTEXITCODE -ne 0) { throw 'Revision catalog signing failed.' }
            node scripts/update-package.mjs verify-catalog --catalog $fullCatalog --signature (Join-Path $releaseDir 'catalog-v2.sig') --key $env:B6H_PUBLIC_KEY --key-id b6h-update-ed25519-2026-11 --packages-dir $releaseDir
            if ($LASTEXITCODE -ne 0) { throw 'Revision catalog verification failed.' }
          }

          $files = @(Get-ChildItem $releaseDir -File | Where-Object Extension -ne '.sha256')
          foreach ($file in $files) {
            $expectedHash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "$($file.FullName).sha256" -Value "$expectedHash *$($file.Name)" -Encoding ascii -Force
          }
          $lines = @("Release: v$env:B6H_VERSION", "Components: ${{ steps.plan.outputs.components }}", "Update key ID: b6h-update-ed25519-2026-11", 'Package signatures: verified', 'Catalog signature: verified', 'Package payload hashes: verified', 'Installer Authenticode: NotSigned by design')
          $evidence = Join-Path $releaseDir 'RELEASE-EVIDENCE.txt'
          Set-Content -LiteralPath $evidence -Value $lines -Encoding utf8
          $evidenceHash = (Get-FileHash -LiteralPath $evidence -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$evidence.sha256" -Value "$evidenceHash *RELEASE-EVIDENCE.txt" -Encoding ascii
          "releaseDir=$releaseDir" >> $env:GITHUB_OUTPUT
          "previousSetup=$previousSetup" >> $env:GITHUB_OUTPUT

      - name: Verify each staged asset checksum and production installer
        shell: pwsh
        env:
          B6H_CORE_CHANGED: ${{ steps.plan.outputs.core }}
        run: |
          $dir = '${{ steps.assets.outputs.releaseDir }}'
          $files = @(Get-ChildItem -LiteralPath $dir -File | Where-Object Extension -ne '.sha256')
          if ($files.Count -lt 5) { throw "Expected the package/catalog/installer/checksum set; found $($files.Count) files." }
          foreach ($file in $files) {
            $sidecar = "$($file.FullName).sha256"
            if (-not (Test-Path -LiteralPath $sidecar)) { throw "Missing SHA-256 sidecar for $($file.Name)." }
            $expected = (Get-Content -LiteralPath $sidecar -Raw).Trim()
            $actual = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne "$actual *$($file.Name)") { throw "SHA-256 mismatch for $($file.Name)." }
          }
          if ($env:B6H_CORE_CHANGED -eq 'true') {
            $setup = Get-ChildItem -LiteralPath $dir -Filter 'B6H-v*-x64-Setup.exe' -File
            $app = 'src-tauri/target/x86_64-pc-windows-msvc/release/b6h.exe'
            $runner = 'src-tauri/target/x86_64-pc-windows-msvc/release/b6h-update-runner.exe'
            $forbidden = @('local-test-only', 'B6H_UPDATE_TEST_CA', 'B6H_UPDATE_TEST_ENDPOINT', 'https://localhost:8443', 'B6H_TEST_')
            $testKeyHex = 'AE0E54C009C07D5C26150D1F4C910A5CB50C9BCB714F40B308AEC040BA1ACCBF'
            $productionKeyHex = 'db1c5981992f0efc47edd9b9f4d5cc9d9e5a29e655d15d3b71b8d5d569c74b0c'
            foreach ($binary in @($app, $runner)) {
              $data = [IO.File]::ReadAllBytes($binary)
              $text = [Text.Encoding]::ASCII.GetString($data)
              foreach ($marker in $forbidden) { if ($text.Contains($marker)) { throw "Production binary contains test marker '$marker': $binary" } }
              if ([Convert]::ToHexString($data).Contains($testKeyHex)) { throw "Production binary contains the local test trust root: $binary" }
              if (-not $text.Contains('b6h-update-ed25519-2026-11') -or -not $text.Contains($productionKeyHex)) { throw "Production trust root is missing from $binary" }
            }
            if ($setup.Count -ne 1 -or (Get-AuthenticodeSignature $setup[0].FullName).Status -ne 'NotSigned') { throw 'Expected one unsigned lightweight Setup.exe.' }
          }

      - name: Create or resume the draft release
        shell: pwsh
        env:
          B6H_RELEASE_DIR: ${{ steps.assets.outputs.releaseDir }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft.Trim() -ne 'true') { throw "Release $tag is already published; refusing to replace its assets." }
            $assets = @(Get-ChildItem -LiteralPath $env:B6H_RELEASE_DIR -File | ForEach-Object FullName)
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --verify-tag --latest=false --title "B6H $tag — Installer & Modular Update" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft GitHub release.' }
            $assets = @(Get-ChildItem -LiteralPath $env:B6H_RELEASE_DIR -File | ForEach-Object FullName)
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY
          }

      - name: Verify uploaded draft assets before publication
        shell: pwsh
        env:
          B6H_PUBLIC_KEY: ${{ steps.signing.outputs.publicPath }}
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP 'b6h-uploaded-release'
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir $verifyDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the draft release assets for verification.' }
          foreach ($file in Get-ChildItem -LiteralPath $verifyDir -File | Where-Object Extension -ne '.sha256') {
            $sidecar = "$($file.FullName).sha256"
            if (-not (Test-Path -LiteralPath $sidecar)) { throw "Uploaded release is missing the checksum for $($file.Name)." }
            $expected = (Get-Content -LiteralPath $sidecar -Raw).Trim()
            $actual = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne "$actual *$($file.Name)") { throw "Uploaded checksum mismatch for $($file.Name)." }
          }
          node scripts/update-package.mjs verify-catalog --catalog (Join-Path $verifyDir 'catalog.json') --signature (Join-Path $verifyDir 'catalog.sig') --key $env:B6H_PUBLIC_KEY --key-id b6h-update-ed25519-2026-11 --packages-dir $verifyDir
          if ($LASTEXITCODE -ne 0) { throw 'Uploaded catalog and packages failed signature/integrity verification.' }
          if (Test-Path -LiteralPath (Join-Path $verifyDir 'catalog-v2.json')) {
            node scripts/update-package.mjs verify-catalog --catalog (Join-Path $verifyDir 'catalog-v2.json') --signature (Join-Path $verifyDir 'catalog-v2.sig') --key $env:B6H_PUBLIC_KEY --key-id b6h-update-ed25519-2026-11 --packages-dir $verifyDir
            if ($LASTEXITCODE -ne 0) { throw 'Uploaded revision catalog failed signature/integrity verification.' }
          }

      - name: Publish verified release as Latest
        id: publish
        shell: pwsh
        run: |
          if ('${{ steps.plan.outputs.revision }}' -ne '0') { throw 'Revision publication is blocked until the shipped base-version updater has completed verified discovery and activation testing.' }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest

      - name: Verify Settings discovery from the previous compatible installation
        shell: pwsh
        env:
          B6H_ONLINE_DISCOVERY_SMOKE: '1'
          B6H_EXPECTED_COMPONENTS: ${{ steps.assets.outputs.legacyComponents }}
          B6H_VERSION: ${{ steps.plan.outputs.version }}
          B6H_PREVIOUS_SETUP: ${{ steps.assets.outputs.previousSetup }}
        run: node scripts/verify-online-discovery.mjs --setup "$env:B6H_PREVIOUS_SETUP" --version $env:B6H_VERSION --expected $env:B6H_EXPECTED_COMPONENTS

      - name: Return release to draft if online discovery fails
        if: failure() && steps.publish.outcome == 'success'
        run: gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft --latest=false

      - name: Remove ephemeral signing material
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('b6h-update-signing.pem', 'b6h-update-public.pem')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
