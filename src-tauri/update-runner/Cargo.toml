[package]
name = "b6h-update-runner"
version = "3.0.0"
edition = "2024"
rust-version = "1.90"
build = "build.rs"

[features]
update-test-keys = []

[[bin]]
name = "b6h-update-runner"
path = "../src/update_runner.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
ring = "0.17.14"
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
